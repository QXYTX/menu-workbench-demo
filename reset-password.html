<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>菜单工坊 · 设置密码</title><style>:root{--g:#146a4b;--d:#123d2d;--l:#b9dc52;--line:#dce6df;--bg:#f5f7f4}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 15%,#e5f1dd 0,transparent 30%),var(--bg);font:15px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#15271f}.page{min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(430px,100%);padding:34px;background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 55px #1646301a}.logo{display:flex;align-items:center;gap:9px;font-size:18px;font-weight:800}.mark{width:32px;height:32px;border-radius:8px;background:var(--l);display:grid;place-items:center;color:var(--d);font-size:12px}h1{font-size:25px;margin:26px 0 5px}p{color:#6d7b73}.field{display:grid;gap:7px;margin:16px 0}.field label{font-weight:700}.field input{height:44px;border:1px solid var(--line);border-radius:8px;padding:0 12px}button{width:100%;height:44px;border:0;border-radius:8px;background:var(--g);color:#fff;font:inherit;font-weight:700;margin-top:8px}</style><body><main class="page"><form class="card" action="workspace.html"><div class="logo"><span class="mark">美餐</span>菜单工坊</div><h1>设置新密码</h1><p>首次登录，请先设置新密码后进入工作台。</p><div class="field"><label for="new-password">新密码</label><input id="new-password" type="password" minlength="6" required></div><div class="field"><label for="confirm-password">确认新密码</label><input id="confirm-password" type="password" minlength="6" required></div><button type="submit">保存并进入工作台</button></form></main></body></html>
